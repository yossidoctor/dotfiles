# Left prompt: dir + git + char. Right: status/duration/jobs/identity/time.
# Language/cloud modules are default-on and render only in matching dirs, so they're
# not listed here — only deviations from Starship defaults are.

palette = "main"

format = """
$directory\
$git_branch\
$git_status\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
${custom.git_identity}\
$time"""

[palettes.main]
ok = "#a6e3a1"
err = "#f38ba8"
branch = "#cba6f7"
dir = "#89dceb"
identity = "#89b4fa"
muted = "#6c7086"

[character]
success_symbol = "[❯](bold ok)"
error_symbol = "[❯](bold err)"

[directory]
truncate_to_repo = false
style = "bold dir"

[git_branch]
symbol = " "
style = "bold branch"
truncation_length = 18

# Counts per state (e.g. "3!2?"). Starship's own stashed symbol is `$`, which
# reads as a shell prompt mid-line; the rest of its symbols are kept.
[git_status]
style = "bold err"
stashed = "≡"

[cmd_duration]
min_time = 3000

[status]
disabled = false

# Default-off in Starship; enabled here for a 24h clock in the right prompt.
[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style) "
style = "white"

# Project version (pyproject/package.json) is noise in the prompt.
[package]
disabled = true

# Active git identity per-repo: identities route by includeIf path (git/config).
# Surfaces which one a repo commits as, so a misrouted repo is visible before
# committing. Compares against the personal email read from its SoT, so no
# address is mirrored here; anything else is a work identity. `when` defaults
# to false for a custom module, so it is set; `require_repo` is Starship's own
# repo test, so no shell is spawned outside one. `shell` is set because
# Starship otherwise resolves one itself, at many times the command's own cost
# (`starship timings` shows the module's share); /bin/sh starts in ~2ms.
[custom.git_identity]
shell = ["/bin/sh"]
command = """
case "$(git config user.email)" in
  "") echo "?" ;;
  "$(git config -f ~/dotfiles/git/identity user.email)") echo personal ;;
  *) echo work ;;
esac"""
when = true
require_repo = true
format = "[ $output]($style) "
style = "italic identity"
