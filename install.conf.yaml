- defaults:
    link:
      relink: true
      force: true

# A link whose source left this repo is otherwise left dangling in place.
- clean:
    ~/.claude/hooks:
      force: true
    ~/.local/bin:
      force: true
    ~/.config:
      force: true

- create:
    - ~/.claude/hooks
    - ~/.local/bin
    - ~/.config/git/identities.d
    - ~/Library/Application Support/Code/User

- link:
    ~/.zshenv: zsh/zshenv
    ~/.zshrc: zsh/zshrc
    ~/.gitconfig: git/config
    ~/.gitignore_global: git/ignore
    ~/.config/git/identities.d/personal.sh: identities.sh
    ~/.hushlogin: shell/hushlogin
    ~/.local/bin/brew-maintenance: brew/brew-maintenance.sh
    ~/.local/bin/check-doc-refs: scripts/check-doc-refs.sh
    ~/.local/bin/rule-audit: scripts/rule-audit.sh
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/keybindings.json: claude/keybindings.json
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    ~/.claude/statusline-lib.sh: claude/statusline-lib.sh
    ~/.claude/subagent-statusline.sh: claude/subagent-statusline.sh
    ~/.claude/hooks/hook-lib.sh: claude/hooks/hook-lib.sh
    ~/.claude/hooks/hook_lib.py: claude/hooks/hook_lib.py
    ~/.claude/hooks/warn-existing-occurrence.sh: claude/hooks/warn-existing-occurrence.sh
    ~/.claude/hooks/enforce-git-add-paths.sh: claude/hooks/enforce-git-add-paths.sh
    ~/.claude/hooks/redirect-symlink-edits.sh: claude/hooks/redirect-symlink-edits.sh
    ~/.claude/hooks/enforce-foreground-polling.sh: claude/hooks/enforce-foreground-polling.sh
    ~/.claude/hooks/enforce-read-over-shell-read.sh: claude/hooks/enforce-read-over-shell-read.sh
    ~/.claude/hooks/force-background-agents.sh: claude/hooks/force-background-agents.sh
    ~/.claude/hooks/audit-docs-on-stop.sh: claude/hooks/audit-docs-on-stop.sh
    ~/.claude/hooks/ask-matt-banner.sh: claude/hooks/ask-matt-banner.sh
    ~/.claude/hooks/caffeinate-claude.sh: claude/hooks/caffeinate-claude.sh
    ~/.claude/hooks/notify-agent-idle.sh: claude/hooks/notify-agent-idle.sh
    # the test harness ships too: a project layer's hook tests exec it here
    ~/.claude/hooks/tests: claude/hooks/tests
    ~/.claude/skills: claude/skills
    ~/.claude/output-styles: claude/output-styles
    "~/Library/Application Support/Code/User/settings.json": vscode/settings.json

- link:
    ~/.config/aerospace: aerospace
    ~/.config/gh: gh
    ~/.config/ghostty: ghostty
    ~/.config/karabiner: karabiner
    ~/.config/starship.toml: starship/starship.toml

- shell:
    - [bash mac/defaults.sh || true, Apply macOS system defaults (a TCC-refused write is reported and retried next run)]
    - [bash mac/disable-spotlight.sh || true, Disable Spotlight indexing (needs sudo; skipped if it fails)]
    - [bash mac/duti.sh, Apply duti file-type bindings]
    - [bash mac/login-items.sh || true, Register Open-at-Login items (needs System Events automation permission; retried next run if denied)]
    - [bash aerospace/retile-on-quit-watcher.sh, Install/refresh the retile-on-quit LaunchAgent]
    - [bash mac/plist-restore.sh BetterDisplay pro.betterdisplay.BetterDisplay mac/plists/betterdisplay.plist, Restore BetterDisplay settings]
    - [bash mac/plist-restore.sh BetterCmdTab pro.bettercmdtab.BetterCmdTab mac/plists/bettercmdtab.plist, Restore BetterCmdTab settings]
    - [bash mac/vlcrc-restore.sh vlc/vlcrc, Restore VLC settings]
    - [command -v cswap >/dev/null || command -v uv >/dev/null && uv tool install --quiet claude-swap || true, Install claude-swap multi-account Claude Code switcher (skipped until brew bundle installs uv; already installed = no network)]
    - [bash claude/cswap-auto.sh, Install/refresh the cswap auto-switch LaunchAgent]
